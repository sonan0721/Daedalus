name: rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # This verifies oxijolt's SHA-256-checked x86_64 Linux archive. Use
      # JOLTC_PREBUILT=off locally to exercise the CMake/C++ source fallback.
      JOLTC_PREBUILT: require
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Restore workspace Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-workspace-allfeatures-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-workspace-allfeatures-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Install Linux audio build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libasound2-dev
      - name: Check workspace
        run: cargo check --workspace --all-features --locked
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
