[package]
name = "daedalus-project-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native project/session host facade for Daedalus SDKs"

[features]
default = []
window = ["daedalus-renderer/window"]
capture = ["window", "dep:png", "dep:sha2"]

[dependencies]
daedalus-content = { path = "../daedalus-content" }
daedalus-core = { path = "../daedalus-core" }
daedalus-renderer = { path = "../daedalus-renderer", default-features = false }
daedalus-runtime = { path = "../daedalus-runtime" }
thiserror.workspace = true
png = { version = "=0.18.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[[example]]
name = "native_host_smoke"
path = "examples/native_host_smoke.rs"
required-features = ["window"]

[lints]
workspace = true
