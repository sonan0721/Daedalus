[package]
name = "daedalus-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless JSON control CLI for the Daedalus engine"

[features]
default = []
capture = ["dep:daedalus-renderer", "daedalus-renderer/test-fixtures"]
window = ["capture", "daedalus-renderer/window", "dep:glam"]

[[bin]]
name = "daedalus"
path = "src/main.rs"

[dependencies]
clap.workspace = true
daedalus-core = { path = "../daedalus-core" }
daedalus-content = { path = "../daedalus-content" }
daedalus-renderer = { path = "../daedalus-renderer", default-features = false, optional = true }
daedalus-runtime = { path = "../daedalus-runtime" }
daedalus-world = { path = "../daedalus-world" }
glam = { version = "=0.30.9", optional = true }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
