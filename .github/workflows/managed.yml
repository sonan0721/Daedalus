name: managed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    name: managed native integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.402
      - name: Build the Rust bridge
        run: cargo build --locked --release -p daedalus-bridge
      - name: Build managed host and fixtures
        run: dotnet build managed/Daedalus.slnx --configuration Release
      - name: Verify host help and Rust-backed self-test
        env:
          DAEDALUS_NATIVE_PATH: ${{ github.workspace }}/target/release/libdaedalus_bridge.so
        run: |
          dotnet run --no-build --project managed/Daedalus.ManagedHost --configuration Release -- --help
          dotnet run --no-build --project managed/Daedalus.ManagedHost --configuration Release -- --self-test
      - name: Run managed module lifecycle integration tests
        env:
          DAEDALUS_NATIVE_PATH: ${{ github.workspace }}/target/release/libdaedalus_bridge.so
        run: dotnet run --no-build --project managed/Daedalus.ManagedIntegrationTests --configuration Release
